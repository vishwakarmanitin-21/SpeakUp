<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakUp — Backlog</title>
<style>
  :root {
    --accent: #2f8fd0;
    --accent-soft: #e7f2fb;
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7785;
    --line: #e3e7ec;
    --p1: #d64545; --p1-bg: #fbe9e9;
    --p2: #d08a1e; --p2-bg: #fbf1de;
    --p3: #6b7785; --p3-bg: #eef1f4;
    --done: #2e8b57; --done-bg: #e6f4ec;
    --prog: #2f8fd0; --prog-bg: #e7f2fb;
    --back: #8a94a0; --back-bg: #eef1f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 20px 28px; display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 28px 60px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; min-width: 120px;
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .controls input, .controls select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 13px; background: #fff; color: var(--ink);
  }
  .controls input { flex: 1; min-width: 180px; }
  .controls .spacer { flex: 1; }
  .statusFilter {
    display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
    background: #fff; font-size: 13px;
  }
  .statusFilter .sfLabel { color: var(--muted); }
  .statusFilter label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .statusFilter input { margin: 0; cursor: pointer; }
  button.link {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; text-decoration: underline;
  }
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fbfcfd; }
  tr:last-child td { border-bottom: none; }
  td.title { font-weight: 600; }
  td .notes { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-top: 3px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .cat { background: var(--accent-soft); color: var(--accent); }
  .pri-P1 { background: var(--p1-bg); color: var(--p1); }
  .pri-P2 { background: var(--p2-bg); color: var(--p2); }
  .pri-P3 { background: var(--p3-bg); color: var(--p3); }
  select.status { border: none; border-radius: 20px; padding: 3px 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  .st-Done { background: var(--done-bg); color: var(--done); }
  .st-In\ Progress { background: var(--prog-bg); color: var(--prog); }
  .st-Backlog { background: var(--back-bg); color: var(--back); }
  .st-Parked { background: #ede9fe; color: #6d28d9; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
  tr.done td.title { text-decoration: line-through; text-decoration-color: var(--line); }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div>
    <h1>SpeakUp — Backlog</h1>
    <p>Voice-to-structured-text desktop app · priority-ordered backlog &amp; status tracker</p>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search backlog…">
    <select id="fPriority"><option value="">All priorities</option><option>P1</option><option>P2</option><option>P3</option></select>
    <span class="statusFilter" id="fStatus">
      <span class="sfLabel">Status:</span>
      <label><input type="checkbox" value="Backlog" checked> Backlog</label>
      <label><input type="checkbox" value="In Progress" checked> In Progress</label>
      <label><input type="checkbox" value="Parked" checked> Parked</label>
      <label><input type="checkbox" value="Done" checked> Done</label>
    </span>
    <select id="fCategory"><option value="">All categories</option></select>
    <span class="spacer"></span>
    <button class="link" id="reset">Reset status changes</button>
  </div>

  <table>
    <thead><tr><th style="width:42%">Item</th><th>Category</th><th>Priority</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    Status changes are saved in your browser (localStorage) — no server needed.
    App details live in <code>README.md</code>; this page is the single backlog tracker.
  </footer>
</div>

<script>
const ITEMS = [
  // --- Shipped (record of completed work) ---
  {id:'d1', t:'Smart auto-format mode (default)', c:'Intelligence', p:'P1', s:'Done', n:'Detects the active app and adapts tone/format (chat, email, editor, document).'},

  {id:'d8', t:'gpt-4o-transcribe default + model modernisation', c:'Intelligence', p:'P2', s:'Done', n:'Most accurate speech model by default.'},
  {id:'d9', t:'Terminal Ctrl+C crash fix', c:'Reliability', p:'P1', s:'Done', n:'Selection capture no longer sends SIGINT in consoles.'},
  {id:'d10', t:'Settings UI redesign', c:'UX', p:'P2', s:'Done', n:'Contrast, accent, scroll area, dark title bar, key show/test, greyed inapplicable options.'},

  {id:'p1', t:'Make live mode reliable (isolate realtime socket from qasync)', c:'Live', p:'P1', s:'Done', n:'Realtime now runs on its own thread/loop; verified connecting (no DNS fallback), ~1s transcript on release.'},
  {id:'p2', t:'Live caption while speaking', c:'Live', p:'P1', s:'Done', n:'Verified on-device. Floating caption (blinking caret, stable box) streams word-by-word via Deepgram when DEEPGRAM_API_KEY is set; OpenAI server-VAD (per-pause) otherwise. OpenAI batch fallback. Deepgram key entered in Settings; docs updated.'},
  {id:'p2b', t:'Snappier instant output (latency)', c:'UX', p:'P1', s:'Done', n:'Streaming front-loads the first words and pastes on a background thread that overlaps with generation. Transcript ~0.3s; the rewrite is the whole perceived wait. The keep-alive client that once caused an anyio cancel-scope crash is now safe — all OpenAI calls run on a dedicated rewrite thread/loop with a persistent client. Cold-start handled by a keep-warm heartbeat (see p25).'},
  {id:'p3', t:'"Nitin Mode" — style learning', c:'Intelligence', p:'P1', s:'Parked', n:'Learn the user\'s writing voice from real samples so output sounds personal. Parked 2026-06-28.'},

  // --- Pending: P2 ---
  {id:'p4', t:'Re-run last dictation in another mode', c:'UX', p:'P2', s:'Done', n:'Tray → "Re-run last dictation" lists every mode; re-rewrites the cached last transcript in the chosen mode and delivers via the configured output — no re-speaking. Re-detects the active app for Smart mode.'},
  {id:'p5', t:'Dictation history (copy / re-run)', c:'UX', p:'P2', s:'Backlog', n:'Small window of recent transcripts and outputs.'},
  {id:'p6', t:'Auto-learning dictionary', c:'Intelligence', p:'P2', s:'Done', n:'VocabLearner watches dictations for recurring proper-noun-like words not already in your dictionary and surfaces them as Add/Ignore suggestions in Settings → Personal Dictionary (only mid-sentence capitalised words count; threshold 3; large common/brand/acronym stop-list; stored in vocab_suggestions.json). Hardened + made toggleable in p23.'},
  {id:'p7', t:'In-app feedback when falling back to batch', c:'UX', p:'P2', s:'Done', n:'Implemented: when live transcription drops to batch (fell back mid-run, or could not start), a quiet tray balloon "Live transcription unavailable — used standard mode." appears via a pipeline notice callback. Never blocks dictation.'},
  {id:'p8', t:'Tests for new features', c:'Quality', p:'P2', s:'Done', n:'Added tests/test_new_features.py (11 tests): cost estimation, VocabLearner extraction/ignore, prompt assembly, streaming inserter boundaries/order/clipboard-restore, and the live→batch fallback notice. Also fixed 3 stale tests (modern speech-model default, renamed config globals, streaming-output default). Full suite: 30 passing.'},
  {id:'p9', t:'Rebuild .exe + update PyInstaller spec', c:'Distribution', p:'P2', s:'Done', n:'Rebuilt dist/SpeakUp.exe (~92 MB, PyInstaller 6.21) with the full recent batch: word-by-word live captions + Deepgram, snappier output, first-run onboarding, cost visibility, auto-learning dictionary, and the fallback hint. Spec updated to bundle the lazily-imported app modules + scipy.io.wavfile (websockets already bundled). Verified no API key strings in the binary.'},
  {id:'p10', t:'First-run onboarding', c:'Distribution', p:'P2', s:'Done', n:'Implemented: 3-step OnboardingDialog on first run (API key → mic test with live level meter → 30-sec tutorial), skippable, sets onboarding_complete. Re-runnable from tray → Run setup again. Awaiting on-device check.'},
  {id:'p11', t:'Cost visibility', c:'UX', p:'P2', s:'Done', n:'Implemented: usage_tracker estimates per-run cost (STT per-minute + GPT tokens at approx list prices) and aggregates this-month/lifetime; viewable via tray → Usage & cost. Older runs backfilled from word counts. Awaiting on-device check.'},
  {id:'p22', t:'Code-sign the exe (remove SmartScreen warning)', c:'Distribution', p:'P2', s:'Parked', n:'Removes the "Windows protected your PC" warning for people you share it with. ~$10/mo Azure Trusted Signing; needs account setup. Parked for now.'},

  // --- Pending: P3 ---
  {id:'p12', t:'App icon (exe, window, tray)', c:'UX', p:'P3', s:'Done', n:'Multi-resolution SpeakUp icon; replaces the default exe icon.'},
  {id:'p13', t:'Multi-language support', c:'Intelligence', p:'P3', s:'Backlog', n:'Auto-detect or per-session language.'},
  {id:'p14', t:'Speaker diarization', c:'Intelligence', p:'P3', s:'Backlog', n:'Distinguish speakers (Phase 2). OpenAI now ships a dedicated model for this — gpt-4o-transcribe-diarize (confirmed available on the account, 2026-07-26) — so this no longer needs a custom approach; gpt-transcribe itself does NOT do diarization. Deepgram also offers diarize=true on the streaming path.'},
  {id:'p15', t:'Persistent memory profile', c:'Intelligence', p:'P3', s:'Backlog', n:'Cross-session preferences/profile.'},
  {id:'p16', t:'Mobile companion app', c:'Distribution', p:'P3', s:'Backlog', n:'Phase 2.'},
  {id:'p17', t:'WhatsApp integration', c:'Distribution', p:'P3', s:'Backlog', n:'Phase 2.'},
  {id:'p18', t:'VS Code extension version', c:'Distribution', p:'P3', s:'Backlog', n:'Phase 2.'},
  {id:'p19', t:'Deepgram provider', c:'Reliability', p:'P3', s:'Done', n:'Superseded/delivered: Deepgram is now the ACTIVE live+final transcriber — with a key + live transcription on it produces the word-by-word captions AND the transcript that gets rewritten/pasted. Resolves instantly (DNS fix + DoH fallback) and is guarded against duplicate segments. Leftover extras (a standalone Deepgram provider picker decoupled from the live toggle; auto-fallback if OpenAI degrades) folded into p20.'},
  {id:'p20', t:'Configurable AI provider abstraction', c:'Reliability', p:'P3', s:'Backlog', n:'A clean swap-the-engine socket inside the app. Today each AI service (OpenAI, Deepgram, local) is wired in by hand. This would add one tidy internal layer so the transcription or rewrite provider can be picked from Settings with no code changes. It is plumbing/groundwork, not a user-facing feature — low priority while OpenAI is the only default. Also covers the leftovers from p19: expose Deepgram as a standalone provider choice (decoupled from the live-transcription toggle) and auto-fallback to another provider if OpenAI degrades.'},
  {id:'p21', t:'Self-host / offline mode', c:'Distribution', p:'P3', s:'Backlog', n:'Run the ENTIRE pipeline on your own PC — no internet, no API keys, no per-use cost, maximum privacy. Local speech-to-text already exists (the Local / faster-whisper provider in Settings); the missing piece is a local AI model to do the cleanup/rewrite step that is currently always OpenAI GPT in the cloud.'},

  // --- Shipped: 2026-07-18 session (post-launch polish) ---
  {id:'p23', t:'Dictionary suggestions: bigger stop-list + kill-switch', c:'Intelligence', p:'P2', s:'Done', n:'Auto-learning dictionary kept suggesting obvious words (Chrome, GitHub, Gmail, ETF, Review, I\'ve, Windows). Expanded the stop-word set (contractions, brands/tech the STT already knows, Title-Case business words, acronyms), raised the recurrence threshold 2→3, and _prune_common() drops already-stored junk on launch. Added a kill-switch: suggest_dictionary_terms setting (default on) with a "Suggest new terms from my dictations" checkbox in Settings → Personal Dictionary. Extends p6.'},
  {id:'p24', t:'One-command release script (release.ps1)', c:'Distribution', p:'P2', s:'Done', n:'Manually running the three release steps risked shipping a half-done update (GitHub code current but its exe or the installed copy stale). release.ps1 runs tests → PyInstaller build → gh release upload --clobber (creates the release if missing) → close app, overwrite %LOCALAPPDATA% copy, relaunch. Version/tag read from src/version.py so the GitHub release always matches the code. Warns on uncommitted/unpushed changes. Flags: -SkipTests, -NoRelease, -NoInstall, -Relaunch. Documented in README.'},
  {id:'p25', t:'Latency: keep-warm heartbeat + first-word logging + fast model', c:'UX', p:'P1', s:'Done', n:'Logs showed transcription ~0.3s (Deepgram transcribes while speaking) and the whole perceived wait is the GPT rewrite — ~1s warm but ~5s on the first dictation after idle (cold TLS). Background heartbeat pings the rewrite connection every 60s (warm_up throttle 90→50s, httpx keepalive 120→180s) so the first-after-idle dictation is as fast as a warm one. Added time-to-first-word logging (the latency actually perceived). Offered gpt-4.1-nano as a fastest option (not default). Supersedes the reverted keep-alive attempt in p2b — now safe on the dedicated rewrite thread/loop.'},
  {id:'p35', t:'Track OpenAI speech-model generation (gpt-transcribe / gpt-live-transcribe)', c:'Intelligence', p:'P2', s:'Done', n:'Reviewed OpenAI\'s current transcription docs + the whisper→gpt-transcribe migration cookbook (2026-07-26). gpt-4o-transcribe / gpt-4o-mini-transcribe are now LEGACY (still supported); gpt-transcribe is recommended for files and gpt-live-transcribe for realtime. Added gpt-transcribe to the Speech Model list but did NOT change the default: on a live A/B with generated speech it was actually WORSE on the user\'s own terms ("Versal", "K FinTech") than the current gpt-4o-transcribe — the docs\' recommendation is not automatically better for a given voice, so it is offered to try, not forced. Verified the app\'s existing call shape (response_format=text, language=en, prompt) still works on the new model despite the cookbook\'s caution. Wired the new `keywords` parameter (literal names, max 100) for gpt-transcribe, which FIXED both of its earlier errors — strengthens self-learning phase 1. Fixed a latent bug: the realtime path took whatever whisper_model was set, so picking a FILE-only model (gpt-transcribe, whisper-1 — both 404 on the realtime endpoint) would have broken live transcription; it now maps to gpt-live-transcribe. Then the realtime-transcription docs surfaced a bug that fix would otherwise have introduced: gpt-live-transcribe takes a `languages` ARRAY, not the legacy `language` string, and sending both is disallowed — the session config now picks the right field per model generation. Also wired the realtime session\'s `prompt` + `keywords` to the dictionary (ordinary words filtered), matching what Deepgram and the batch path already do. Checked the general Realtime guide too: the client sends only Authorization and no deprecated OpenAI-Beta header, so it is already GA-compliant — no change needed. NOTE the realtime path is dormant while a Deepgram key is set, so these are reasoned + unit-tested but not live-exercised.'},

  {id:'p36', t:'Transcription benchmark (measure models on YOUR voice, not the changelog)', c:'Quality', p:'P2', s:'Done', n:'scripts/benchmark_transcription.py compares engines on a passage dense with the user\'s real terms, scoring TERM RECALL (what you actually notice — a mangled name is what you retype) and WER. Modes: --record (your own mic, the only result that counts), --audio (a saved WAV), --generate (TTS, no mic needed), --trials N (averages over several TTS voices, because single runs are noisy — nova-2 scored 10/13 then 8/13 on consecutive runs). Findings from 4 trials: gpt-4o-mini-transcribe 12.8/13 @5.2% WER > gpt-4o-transcribe 11.8 @7.6% > gpt-transcribe 10.0 @12.2% > nova-2 9.0 @16.9% > nova-3 8.8 @17.4%. CONCLUSION: nova-3 is NOT an upgrade over nova-2 here, so the migration was not made; the newest OpenAI model is the worst of its three; and the ACTIVE transcriber (Deepgram nova-2) trails OpenAI by ~3x WER. Verified nova-3 keyterm biasing genuinely applies (7/13 -> 9/13) and that Deepgram silently 200s on unknown params, so HTTP status alone proves nothing. CAVEAT: synthesised speech is clean and accent-neutral; a real recording is needed before changing the live engine. REAL-VOICE RESULT (2026-07-26, Nitin reading the passage, 1 trial): gpt-4o-transcribe 12/13 @7.0% WER > gpt-live-transcribe 11/13 @7.0% > gpt-4o-mini-transcribe 11/13 @16.3% > gpt-transcribe 10/13 @18.6% > nova-3 9/13 @23.3% > nova-2 8/13 @30.2%. This REVERSED the synthetic finding on Deepgram: on real voice nova-3 IS better than nova-2 (+1 term, -7pp WER) where synthetic showed a dead heat — vindicating the insistence on a real recording. Bigger finding: the ACTIVE engine (nova-2) is the WORST of the six on the user\'s own voice, ~4x the WER of the best, while OpenAI\'s gpt-live-transcribe streams deltas (so it can drive live captions) at 11/13 @7.0% — and the app already implements that path (RealtimeTranscriber), it is simply out-ranked by the Deepgram branch. See p37.'},

  {id:'p37', t:'Live engine is now an explicit setting (Deepgram vs OpenAI)', c:'Live', p:'P1', s:'Done', n:'SHIPPED the toggle, NOT a default change — Settings → Transcription → Live engine (auto | deepgram | openai; live_engine). "auto" preserves the historical behaviour exactly, so nothing changes until you choose. Asking for Deepgram without a key falls back to OpenAI with a quiet notice rather than failing. Each dictation logs "Live engine: …" so an A/B is verifiable from the log. Verified end-to-end that each setting instantiates the right client. The DEFAULT stays auto deliberately: accuracy favours OpenAI on the real-voice benchmark, but latency (the reason Deepgram was picked) is the counterweight. LATENCY NOW MEASURED from real use (2026-08-01): Deepgram n=477 transcribe 0.46s median, first word 1.73s median; OpenAI n=16 transcribe 1.67s, first word 2.98s — so OpenAI costs ~1.2s per dictation for its accuracy. User confirmed on 2026-08-01 that captions work and "quality feels better" on OpenAI. OPTIMISATION SPOTTED: runs that ended with 0 segments (transcript taken from accumulated deltas) finished in ~0.84s, while runs that waited for a `completed` event took ~1.6-1.7s — so bounding the wait for the final event and falling back to delta text could recover roughly a second, at some accuracy risk since the final transcript can correct earlier deltas. See p38. Original rationale: real-voice benchmark (p36) put the ACTIVE engine last: nova-2 8/13 terms @30.2% WER vs gpt-live-transcribe 11/13 @7.0%. gpt-live-transcribe streams deltas, so it can drive word-by-word captions the way Deepgram does, and the app ALREADY implements that path (RealtimeTranscriber) — start_recording simply prefers the Deepgram branch whenever DEEPGRAM_API_KEY is set. Proposed: make the live engine an explicit setting (deepgram | openai | auto) instead of "whoever has a key", defaulting unchanged until proven in daily use. UNMEASURED and required before switching: perceived LATENCY (Deepgram was chosen for snappy word-by-word captions; OpenAI realtime segments on server VAD) and cost per minute. METHOD CAVEATS on the numbers: single trial, mic peaked at 1.000 (possible clipping), the benchmark drives Deepgram over REST while the app uses STREAMING (which is typically no better), and WER is inflated for engines that captured the user re-reading the opening line — term recall is the sturdier metric here and it agrees.'},

  {id:'p38', t:'Close the ~1.2s latency gap on the OpenAI live engine', c:'Live', p:'P1', s:'Done', n:'FIXED, and the cause was not what was proposed. Probing the API showed (a) NOTHING is ever sent after the committed buffer\'s transcript — 0 events after `completed` across trials — yet the loop still waited out its 0.8s quiet period on every dictation, and (b) the delta text and the final transcript were IDENTICAL, so the feared accuracy trade did not exist. The fix is therefore zero-risk: finish as soon as the final transcript arrives (should_finish()), keeping the quiet/hard-cap rules for the VAD path and as a backstop. No text is discarded. Measured end-to-end on the real session object with real-time-paced audio: release->transcript 1.16s vs a 1.67s median before. Also tested the documented `delay: "low"` option — accepted but SLOWER (5.89s vs 4.04s to finalise), so not adopted. Original analysis: measured in real use: OpenAI live costs ~1.2s more than Deepgram per dictation (first word 2.98s vs 1.73s median). The logs show WHERE it goes: runs whose transcript came from accumulated deltas finished in ~0.84s, while runs that waited for a `completed` event after the commit took ~1.6-1.7s. So the wait for the final event is roughly a second of the gap. Proposal: on release, bound the wait for `completed` (e.g. 300-400ms) and fall back to the delta text already accumulated. RISK: the final transcript can CORRECT earlier deltas, so this trades a little accuracy for the latency — which would partly undo the reason for switching engines. Measure both before adopting: compare delta-only vs completed text on the same clips, and only ship if the difference is negligible. Also worth testing the realtime `delay: "low"` option documented for gpt-live-transcribe.'},

  {id:'p39', t:'Deepgram feature audit — every option assessed, no changes needed', c:'Live', p:'P2', s:'Done', n:'Audited nova-3\'s full transcription feature list against real-voice audio so this does not get re-litigated. USING (all four that matter): keyterm (27 terms — without it 13/13 collapses to 7/13), smart_format + punctuate (essential: without them the transcript is all lowercase with no punctuation and dictionary terms lose their capitals — invisible to WER, which normalises punctuation, so judged by reading the output), interim_results (required for captions). REJECTED as harmful: profanity_filter (censors the user), redact (destroys dictated content — a spoken phone number becomes a tag), numerals (MEASURED WORSE, 14.0% vs 11.6% WER; smart_format already formats numbers and the rewrite has explicit number rules), dictation (no measured gain; risks "the period of the loan" -> "the . of the loan"), keywords (nova-3 does not support it). IRRELEVANT: diarize (single speaker), search (returns acoustic match positions, not a better transcript), find-and-replace (our phonetic layer is strictly better — it matches sound-alikes, Deepgram\'s needs an exact lowercase word). ENDPOINTING TESTED AND REJECTED: default(10)/100/300/500 all gave identical accuracy (13/13, 11.6%, 7 segments) and, on 3 repeats each, identical post-release latency (0.34s mean for both default and 300, overlapping ranges) — because the client sends CloseStream on release, which forces a flush, so pause-based endpointing is bypassed at the only moment that affects latency. Remaining unused option is vad_events (a speech-started signal — pure UX, no accuracy effect).'},

  // --- Self-learning roadmap (phased; see p30 for the rationale) ---
  {id:'p30', t:'Self-learning Phase 1: bias the transcriber + fix phonetic near-misses', c:'Intelligence', p:'P1', s:'Done', n:'SHIPPED. Learn WITHOUT asking anything of the user, and without storing speech. Two parts: (1) the personal dictionary never reached Deepgram — the actual live transcriber — so send it as nova-2 keyword boosting (keywords=TERM:INTENSIFIER, repeatable, max 100, small intensifiers to avoid false positives); (2) deterministic phonetic near-miss correction: index dictionary terms by a sound-alike key that folds STT-confusable consonant groups (v/w/f, t/d, k/c/g, s/z), slide n-gram windows over the transcript, and repair split/misheard terms ("west or a" -> "Vestora") before the rewrite. No new UI, no privacy trade-off, no latency cost. Highest value/effort ratio of the roadmap. Verified on the real dictionary: "west or a"→Vestora, "well quest"→WealQuest, "well due cate"→Wealducate, "Nithin"→Nitin, while "the west side", "well, that went..." and "make a request" are left alone. Guarded against dictionaries that have accumulated ordinary words (Order, Speak, Additionally, I\'m) — those are never used as correction targets nor boosted, since Deepgram warns that boosting common words raises false positives. Toggle: Settings → Personal Dictionary → "Fix mis-heard dictionary terms automatically" (phonetic_correction). Two false-positive classes found in real use and fixed: (a) multi-word stitching turned "she came all the way" into "she Komal the way" — multi-word matches now need a longer, distinctive key; (b) the REWRITE PROMPT (not the phonetic module) turned "finish" into "KFinTech" because its old wording "if a spoken word sounds like one of these" let the model match ordinary English on a few shared sounds — it now says do NOT force a match and keep the dictated word when in doubt. Live-verified: finish/cloud/final/camps/seaside all survive, while "k fin tech" → KFinTech still works. THIRD false-positive class found 2026-08-26 and fixed: the sound key flattens every vowel, so ordinary English collided with dictionary terms outright - "houses", "issues", "assess" and "excess" all fold to the same key as Axis; "medium" and "Notion" to Nitin; "guides" to Codex. Sliding windows also swallowed neighbouring words and sentence boundaries ("of Vestora" -> "Vestora" deleted the "of"; "Vestora. I" deleted both the full stop and the "I"). Measured on the real log: of 91 corrections ever made, 79 were corrupting speech and only 12 were genuine. Fixed with three guards - (a) a VOWEL-SENSITIVE second key that re-checks the match with the vowels put back, with zero slack for short acronym keys; (b) ordinary-English protection covering plural/past/-ing forms; (c) windows may not cross a clause boundary nor already contain the term, and match exactly rather than fuzzily. Deliberately NO "window contains a function word" rule - the flagship case "west or a" -> Vestora is two function words out of three. Re-verified by replaying all 91 logged corrections: 79/79 harmful now prevented, 10/12 genuine repairs still working (the 2 lost are "we start" -> Vestora, genuinely ambiguous English). Swept 1833 distinct words of the user\'s own prose: 5 rewrites, all correct. 38 tests in tests/test_phonetic.py.'},
  {id:'p31', t:'Self-learning Phase 2: correction capture loop', c:'Intelligence', p:'P2', s:'Backlog', n:'A hotkey right after a dictation opens the output in an editable box; on save the app diffs original vs corrected and classifies each change (term error / punctuation / casing / tone / verbosity). CRITICAL GUARD: distinguish transcription ERRORS from the user CHANGING THEIR MIND — "Tuesday"->"Wednesday" is intent, not error, and learning it would corrupt future dictations. Use phonetic distance as the filter (sound-alike = error, unrelated = intent). Requires storing dictation history locally, so it must be opt-in, local-only, viewable, deletable, with retention limits — this cuts against the app\'s current privacy posture (transcript logging is off by default). EVIDENCE 2026-08-26: the houses->Axis bug (see p30) is exactly what this loop exists to catch - it ran ~79 times across weeks and was only noticed when the user happened to spot it. REFINEMENT to the guard above: p31 assumed sound-alike = transcription error = learn it. When the user reverts a word the app ITSELF changed (every phonetic fix is already logged as "Phonetic fix: X -> Y"), sound-alike means the OPPOSITE - our correction was wrong - and the right lesson is to add that word to the never-replace list, not to learn a new term. That single negative signal would have closed this class automatically instead of by hand-curating the ordinary-word list in phonetic.py, and it is the cheapest first slice of this phase: it needs no dictation history at all, only the last output plus the corrected version. CHEAPEST CAPTURE MECHANISM: a "correct that" hotkey that reads the user\'s current selection and diffs it against the last text SpeakUp pasted - no editable box, no OS accessibility hooks, works in every app, and stores nothing unless the user invokes it.'},
  {id:'p32', t:'Self-learning Phase 3: apply learned corrections + style preferences', c:'Intelligence', p:'P2', s:'Backlog', n:'Term corrections applied DETERMINISTICALLY (find/replace, phonetic-aware) — no model call, so reliable and free. Style preferences injected as a short bounded "your preferences" block in the rewrite prompt ("prefers short sentences", "signs off Regards"). Plus 2-3 relevance-selected past correction pairs as few-shot examples. HARD CAP the injected block (e.g. 15 corrections, 5 style rules, 2 examples) and select by relevance — it goes into EVERY request, so unbounded growth would regress the ~1s latency we worked to get.'},
  {id:'p33', t:'Self-learning Phase 4: "What I\'ve learned" panel', c:'UX', p:'P2', s:'Backlog', n:'Every learned rule visible with occurrence counts, editable and deletable. Not optional: without it the app silently changes the user\'s words with no way to inspect or undo a bad lesson. Also the natural home for the retention/delete-all controls Phase 2 needs. Pairs with confidence thresholds (require N occurrences before auto-applying) and decay of unused rules.'},
  {id:'p34', t:'Self-learning Phase 5: fine-tuning (only if warranted)', c:'Intelligence', p:'P3', s:'Backlog', n:'Fine-tune gpt-4o-mini on accumulated transcript->corrected pairs. Deliberately LAST: needs 500+ pairs, costs money, takes days to show benefit, can silently degrade, and is not inspectable or reversible the way prompt-level learning is. Only consider if Phases 1-4 plateau, and only with a measurable A/B. Note: transcription models are not fine-tunable via the API, so this could only improve the rewrite step.'},

  {id:'p27', t:'Stop clipboard content pasting instead of the dictation', c:'Reliability', p:'P1', s:'Done', n:'Ctrl+V is asynchronous — the target app reads the clipboard when it processes the keystroke. The restore fired just 50ms after the final Ctrl+V, so a still-pending paste read the RESTORED value and inserted the user\'s previous clipboard instead of the transcript (seen in the wild: a DMARC TXT record pasted 3x). Logs proved the rewrite output was correct, so the fault was purely in the paste stage. Fix: restore is delayed 0.6s on a background thread (no perceived latency — the dictation is already pasted) AND guarded so it only restores if the clipboard still holds what we put there; per-chunk settle raised 18ms→35ms so streaming chunks can\'t overwrite before the app consumes the previous paste. 3 regression tests, one verified to fail against the old synchronous restore.'},
  {id:'p28', t:'Auto-version every build (minor bump in release.ps1)', c:'Distribution', p:'P2', s:'Done', n:'32 commits had shipped into a release still labelled v1.0.0, so the version no longer identified a build. Cut v1.1.0 with proper user-facing release notes, then taught release.ps1 to bump the MINOR version on every run (1.1.0→1.2.0→1.3.0) and commit+push it before tagging, so the GitHub tag can never point at a stale commit. -Major starts a new series (1.4.0→2.0.0); -NoBump reuses the current version while iterating. Every exe now has its own version, visible in tray → About, so you can tell at a glance whether a machine has the latest. README documents the flags.'},
  {id:'p29', t:'Numbers as digits in dictated output', c:'Intelligence', p:'P2', s:'Done', n:'Spoken numbers came out spelled as words because the rewrite prompt had no rule about them, so the model defaulted to prose style (Deepgram smart_format already emitted digits, but the rewrite had the final say). Added a contextual rule: DIGITS for money, percentages, dates/years, times, measurements, quantities 10+, versions, decimals, ranges, phone numbers; one-to-nine stay spelled out in casual prose. Verified against live API calls ("twenty five thousand rupees"→25,000; "nine thirty am"→9:30 am; "three point five percent"→3.5%; "three ideas" unchanged).'},
  {id:'p26', t:'Live caption: smooth, expandable, configurable', c:'Live', p:'P1', s:'Done', n:'Playback overhaul. Coalesced bursty interim updates then added a ~30fps typewriter reveal (ease-out) so chunky 2-3 word engine output flows out smoothly. Line-aware subtitle window fixed clipping/flashing past 3 lines. Made it EXPAND up to N lines with NO window resize (fixed tall transparent click-through pane; a bottom-anchored pill grows upward inside it) — avoids the translucent-resize flash. Height is user-configurable (Settings → Appearance → Caption height, 2-12 lines, default 6; caption_max_lines, live-applied). Fixed last-line descenders being clipped (size to whole line-boxes, not ink bounds).'},
  {id:'p40', t:'Clean-up failure pastes the transcript; self-heal a retired model', c:'Reliability', p:'P1', s:'Done', n:'2026-10-24: OpenAI retired gpt-4.1-nano overnight (still listed in models.list, but every call 404s model_not_found). Live captions showed the words, then the rewrite failed and the transcript was DISCARDED, so nothing was pasted. Fix: on any rewrite failure the raw (phonetically corrected) transcript is pasted instead - unless text was already typed mid-stream, to avoid duplicates - with a tray notice naming the real cause. A model_not_found/deprecated error also switches gpt_model to the shipped default (gpt-4o-mini) so the next dictation is formatted; no switch when the default itself is the failing model (no loop). gpt-4.1-nano removed from the Settings list. 7 regression tests.'},
  {id:'p41', t:'Overlapping dictations clobber each other', c:'Reliability', p:'P1', s:'Backlog', n:'Seen 2026-10-24 12:47:12-16: a second hotkey press while the first dictation was still processing started a new live session, then the FIRST run reset the shared _use_realtime/_realtime fields in its finally block - so the second run fell to batch mode and failed with No audio recorded. Fix idea: hand each run its own realtime session object (capture it at stop time) or block a new recording until the previous transcription step finishes.'},
  {id:'p42', t:'Support GPT-5.x clean-up models', c:'Intelligence', p:'P2', s:'Backlog', n:'gpt-5.4-nano / gpt-5.4-mini work (first word ~630-800ms in a single test on 2026-10-24) but reject max_tokens and need max_completion_tokens + reasoning_effort=none (gpt-5-nano needs minimal) and no temperature. The rewrite engine sends the old parameters, so these models fail today. Needed before the 4.x family is retired too.'},
  {id:'p43', t:'Make pipeline errors visible', c:'UX', p:'P2', s:'Backlog', n:'A failing dictation only flashed an error on the compact widget (user opacity 0.41), so a total outage looked like the paste was silently broken. Consider a tray notice for errors too (notices are throttled to one a minute) or a clearer error state.'},
  {id:'p44', t:'Pipeline test opens the real mic and Deepgram', c:'Reliability', p:'P3', s:'Backlog', n:'tests/test_pipeline.py::test_start_recording_resets_cancelled_flag calls start_recording() with the REAL user config, so with live transcription on it opens the microphone and a Deepgram connection during the test run (Deepgram connect failed ... interpreter shutdown in the output, sounddevice warnings in later tests). Patch Config / the live clients in that test.'},
  {id:'p45', t:'Claude Haiku as automatic backup for clean-up', c:'Reliability', p:'P2', s:'Parked', n:'Awaiting Nitin\'s decision (2026-10-24). Anthropic has no speech-to-text, but Claude Haiku 5.5 can do the clean-up step with streaming ($0.10/$0.50 per M tokens vs gpt-4o-mini $0.15/$0.60; first-word latency NOT yet measured). Idea: if the OpenAI rewrite fails, retry on Claude so a model retirement or OpenAI outage never drops formatting. Needs an Anthropic API key (console.anthropic.com, separate from a Claude.ai plan) and the anthropic SDK; the request shape differs (no temperature). Second exception to the OpenAI-only provider policy, justified by reliability, not quality.'},
];

const STATUSES = ['Backlog', 'In Progress', 'Parked', 'Done'];
const PRI_ORDER = {P1: 0, P2: 1, P3: 2};
const KEY = id => 'speakup-backlog-' + id;

function status(item) { return localStorage.getItem(KEY(item.id)) || item.s; }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fp = document.getElementById('fPriority').value;
  const fsChecked = Array.from(
    document.querySelectorAll('#fStatus input:checked')
  ).map(c => c.value);
  const fc = document.getElementById('fCategory').value;

  const rows = ITEMS
    .map(it => ({...it, _s: status(it)}))
    .filter(it => (!fp || it.p === fp) && fsChecked.includes(it._s) && (!fc || it.c === fc)
      && (!q || (it.t + ' ' + it.n + ' ' + it.c).toLowerCase().includes(q)))
    .sort((a, b) => (PRI_ORDER[a.p] - PRI_ORDER[b.p]) || a.id.localeCompare(b.id));

  const tbody = document.getElementById('rows');
  tbody.innerHTML = rows.length ? rows.map(it => `
    <tr class="${it._s === 'Done' ? 'done' : ''}">
      <td class="title">${esc(it.t)}<div class="notes">${esc(it.n)}</div></td>
      <td><span class="badge cat">${esc(it.c)}</span></td>
      <td><span class="badge pri-${it.p}">${it.p}</span></td>
      <td>
        <select class="status st-${it._s}" data-id="${it.id}">
          ${STATUSES.map(s => `<option ${s === it._s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
    </tr>`).join('') : `<tr><td colspan="4" class="empty">No items match your filters.</td></tr>`;

  tbody.querySelectorAll('select.status').forEach(sel => {
    sel.addEventListener('change', e => {
      localStorage.setItem(KEY(e.target.dataset.id), e.target.value);
      render();
    });
  });
  renderStats();
}

function renderStats() {
  const all = ITEMS.map(it => ({...it, _s: status(it)}));
  const by = s => all.filter(it => it._s === s).length;
  const open = all.filter(it => it._s !== 'Done' && it._s !== 'Parked').length;
  document.getElementById('stats').innerHTML = [
    ['Total', all.length], ['Open', open], ['In Progress', by('In Progress')],
    ['Parked', by('Parked')], ['Done', by('Done')],
    ['P1 open', all.filter(it => it._s !== 'Done' && it._s !== 'Parked' && it.p === 'P1').length],
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Populate category filter
const cats = [...new Set(ITEMS.map(i => i.c))].sort();
const fcSel = document.getElementById('fCategory');
cats.forEach(c => { const o = document.createElement('option'); o.textContent = c; fcSel.appendChild(o); });

['search', 'fPriority', 'fCategory'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
document.querySelectorAll('#fStatus input').forEach(cb =>
  cb.addEventListener('change', render));
document.getElementById('reset').addEventListener('click', () => {
  ITEMS.forEach(it => localStorage.removeItem(KEY(it.id)));
  render();
});

render();
</script>
</body>
